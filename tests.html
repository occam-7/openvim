  <title>OpenVim 中文版 - 引擎测试</title>

  <!-- GENERAL (mostly) -->
  <script type="text/Javascript" src="js/engine/messager.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/view/blinking.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/engine/generic.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/engine/document.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/view/comparison.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/view/context_help.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>

  <!-- VIM specific parts -->
  <script type="text/Javascript" src="js/engine/executor.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/engine/interpreter.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/view/view.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/commands/searchcommands.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/commands/visualcommands.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/commands/timescommands.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/commands/commands.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/view/event.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>

  <!-- TESTING -->
  <script type="text/Javascript" src="js/testing/testsengine.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/testing/tests.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/testing/testview.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>
  <script type="text/Javascript" src="js/testing/init_testing.js?version=711af7d62ba74e025f08c7c32752efada02a631f"></script>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.6.4/jquery.min.js"></script>
  <script type="text/javascript">
    $(document).ready(function () {
        init_testing();
    });
  </script>
 </head>

<body>
    <div class="testview">
        <div class="test_statistics">
            <div class="tests_run"></div>
            <div class="tests_succeeded"></div>
            <div class="tests_failed"></div>
        </div>

        <div class="tests_result">
            <div class="tests_allpassed">
                <h2>全部通过</h2>
            </div>

            <div class="tests_problems">
                <h2>有失败</h2>
            </div>
        </div>

        <div class="test_introduction">
            <p>这一页是 Vim 引擎的单元测试。有些命令还没实现，对应的测试会失败。</p>
            <p>点测试名称可以展开细节。</p>
            <p>一个测试通常包含初始文本、命令（按键组合）、期望结果，以及引擎执行后的实际结果。</p>
            <p>通过的测试标题是绿色，失败的是红色。</p>
            <input type="button" value="展开/收起所有测试的详情" id="show_test_details" style="display: none;" />
        </div>

        <h3>测试</h3>
        <div id="appendtarget" style="clear: both;"></div>

        <div class="text" style="display: none;"></div>
    </div>
</body>
</html>
